<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rapportini intervento esterno</title>
<meta name="theme-color" content="#1D2B53">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script src="localdb.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=Tinos:wght@700&display=swap" rel="stylesheet">
<script src="lib/capacitor.js" onerror="this.remove()"></script>

<style>
:root{
  --bg:#E4E8EE; --sheet:#FFFFFF; --ink:#1D2B53; --muted:#5B6781; --pen:#2340B8;
  --line:#C5CCD6; --carbon:#FFF1B0; --stamp:#C0392B; --ok:#2E7D4F; --warn:#A8660B;
  --field:#F6F8FB; --shadow:0 1px 0 rgba(29,43,83,.08), 0 8px 24px -12px rgba(29,43,83,.25);
  --sans:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --sez:"Times New Roman",Times,"Tinos",serif;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12161D; --sheet:#1B212B; --ink:#E6E9EF; --muted:#98A2B6; --pen:#94AAFF;
    --line:#343E4D; --carbon:#4A4115; --stamp:#F0776A; --ok:#6CC495; --warn:#E5B35A; --field:#222936;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#12161D; --sheet:#1B212B; --ink:#E6E9EF; --muted:#98A2B6; --pen:#94AAFF;
  --line:#343E4D; --carbon:#4A4115; --stamp:#F0776A; --ok:#6CC495; --warn:#E5B35A; --field:#222936;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:16px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 16px}
header.top h1{font:700 1.75rem/1.1 var(--cond);margin:0;letter-spacing:.01em}
header.top p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.btn{appearance:none;border:1.5px solid var(--ink);background:transparent;padding:9px 14px;border-radius:6px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--ink);color:var(--sheet)}
.btn.ghost{border-color:var(--line)}
.btn.wa{border-color:#1FA855;background:#1FA855;color:#fff}
.btn.danger{border-color:var(--stamp);color:var(--stamp)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:.875rem}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.toolbar input,.toolbar select{flex:1 1 180px;padding:9px 12px;border:1.5px solid var(--line);border-radius:6px;background:var(--sheet)}
.toolbar select{flex:0 1 180px}

/* list */
.list{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:center;background:var(--sheet);border-left:6px solid var(--carbon);padding:12px 14px;border-radius:4px;box-shadow:var(--shadow);cursor:pointer;text-align:left;border-top:0;border-right:0;border-bottom:0;width:100%}
.rowwrap{display:flex;align-items:stretch;gap:6px}
.rowwrap .row{flex:1;min-width:0}
.rowdel{flex:0 0 44px;border:0;background:var(--sheet);color:var(--muted);border-radius:4px;box-shadow:var(--shadow);cursor:pointer;display:flex;align-items:center;justify-content:center}
.rowdel:hover{color:var(--stamp)}
.rowdel:disabled{opacity:.4;cursor:wait}
.row .num{font:700 1.1rem/1 var(--cond);color:var(--muted);font-variant-numeric:tabular-nums}
.row .who{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{grid-column:2;color:var(--muted);font-size:.875rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .stamp{grid-row:1 / span 2;grid-column:3}
.stamp{display:inline-block;font:700 .8rem/1 var(--cond);letter-spacing:.06em;padding:5px 8px;border:2px solid currentColor;border-radius:3px;transform:rotate(-4deg);opacity:.9}
.s-bozza{color:var(--warn)} .s-completato{color:var(--ok)}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--carbon);border-radius:6px;padding:12px 14px;margin-bottom:14px;font-size:.9375rem}
.banner>div{flex:1 1 260px}
.banner.ro{background:var(--field);border:1.5px solid var(--warn)}
.login{max-width:420px;margin:24px auto}
.login-body{padding:20px 18px;display:flex;flex-direction:column;gap:14px}
.login-logo{width:180px;max-width:70%;align-self:center;margin-bottom:6px;border-radius:4px}
.login-err{margin:0;color:var(--stamp);font-weight:600;font-size:.9375rem}
.login .btn.ghost.sm{align-self:center;border:0}
.who-line{font-size:.8125rem;color:var(--muted);margin-top:2px}
.empty{background:var(--sheet);border:2px dashed var(--line);border-radius:6px;padding:32px 20px;text-align:center}
.empty h2{font:600 1.35rem var(--cond);margin:0 0 6px}
.empty p{margin:0 0 16px;color:var(--muted)}
.stats{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:.875rem;margin:0 0 12px}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}

/* sheet */
.sheet{background:var(--sheet);box-shadow:var(--shadow);border-radius:4px;overflow:hidden}
.sheet-head{background:var(--carbon);padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.sheet-head h2{margin:0;font:700 1.5rem/1.1 var(--cond)}
.sheet-head .n{font:600 1rem var(--cond);color:var(--muted)}
fieldset{border:0;border-top:1.5px solid var(--line);margin:0;padding:14px 18px 18px}
fieldset:first-of-type{border-top:0}
legend{font:600 1.05rem var(--cond);padding:0;margin:0 0 8px;float:left;width:100%}
legend+*{clear:both}
.sez-toggle{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;cursor:pointer;font:700 1.35rem/1.2 var(--sez);color:var(--ink);padding:4px 0;border-radius:4px;min-height:36px}
.sez-toggle:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.sez-toggle .chev{flex:0 0 auto;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--field);border:1.5px solid var(--line);color:var(--muted)}
.sez-toggle .chev svg{transition:transform .18s ease}
.sez-toggle .riep{flex:1;min-width:0;font:400 .875rem var(--sans);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
fieldset.chiusa{padding-bottom:12px}
fieldset.chiusa>legend{margin-bottom:0}
fieldset.chiusa>.sez-body{display:none}
fieldset.chiusa .chev svg{transform:rotate(-90deg)}
fieldset:not(.chiusa) .riep{display:none}
.sez-all{display:flex;justify-content:flex-end;gap:6px;padding:10px 18px 0}
@media (prefers-reduced-motion:reduce){.sez-toggle .chev svg{transition:none}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.grid .wide{grid-column:1 / -1}
.grid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.grid+.grid{margin-top:12px}
@media (max-width:720px){.grid.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.grid.g3{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:3px;font-size:.8125rem;color:var(--muted);font-weight:500}
label.f input,label.f select,label.f textarea{padding:8px 10px;border:1.5px solid var(--line);border-radius:5px;background:var(--field);color:var(--pen);font-size:1rem;font-weight:500;min-width:0;width:100%}
label.f textarea{min-height:88px;resize:vertical;line-height:1.45}
label.f input:focus,label.f select:focus,label.f textarea:focus{border-color:var(--pen);outline:none;background:var(--sheet)}
.calc{display:flex;gap:20px;flex-wrap:wrap;margin-top:10px;font-size:.9rem;color:var(--muted)}
.calc b{color:var(--ink);font:700 1.2rem var(--cond);font-variant-numeric:tabular-nums}
.tscroll{overflow-x:auto}
table.mat{width:100%;border-collapse:collapse;min-width:460px}
table.mat th{font:600 .8125rem var(--sans);color:var(--muted);text-align:left;padding:4px 6px;border-bottom:1.5px solid var(--line)}
table.mat td{padding:4px 3px}
table.mat input{width:100%;padding:7px 8px;border:1.5px solid var(--line);border-radius:5px;background:var(--field);color:var(--pen);font-weight:500}
table.mat .q{width:80px} table.mat .c{width:130px} table.mat .x{width:40px}
.iconbtn{border:0;background:transparent;color:var(--muted);font-size:1.3rem;line-height:1;cursor:pointer;padding:6px;border-radius:4px}
.iconbtn:hover{color:var(--stamp)}
.sigs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.sig{display:flex;flex-direction:column;gap:6px}
.sig .lab{font-size:.8125rem;color:var(--muted);font-weight:500;display:flex;justify-content:space-between;align-items:center}
.sig canvas{width:100%;height:150px;background:var(--field);border:1.5px dashed var(--line);border-radius:5px;touch-action:none;display:block}
.combo-wrap{position:relative;display:flex;flex-direction:column;gap:3px;font-size:.8125rem;color:var(--muted);font-weight:500}
.combo{display:flex;align-items:stretch}
.combo input{flex:1;min-width:0;padding:8px 10px;border:1.5px solid var(--line);border-right:0;border-radius:5px 0 0 5px;background:var(--field);color:var(--pen);font-size:1rem;font-weight:500}
.combo input:focus{border-color:var(--pen);outline:none;background:var(--sheet)}
.combo-btn{flex:0 0 44px;border:1.5px solid var(--line);border-radius:0 5px 5px 0;background:var(--field);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center}
.combo-btn:disabled{opacity:.4;cursor:not-allowed}
.combo-btn[aria-expanded="true"] svg{transform:rotate(180deg)}
.combo-pop{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--sheet);border:1.5px solid var(--line);border-radius:6px;box-shadow:var(--shadow);z-index:15;padding:8px}
.combo-pop input{width:100%;padding:8px 10px;border:1.5px solid var(--line);border-radius:5px;background:var(--field);color:var(--ink);font-size:.9375rem}
.combo-pop ul{list-style:none;margin:6px 0 0;padding:0;max-height:260px;overflow-y:auto}
.combo-pop li{padding:6px 6px 6px 10px;border-radius:4px;cursor:pointer;display:flex;align-items:center;gap:8px;color:var(--ink);font-size:.9375rem}
.combo-pop li .lv{flex:1;min-width:0;display:flex;flex-direction:column}
.combo-pop li .lv b,.combo-pop li .lv span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li-del{flex:0 0 36px;height:36px;border:0;background:transparent;color:var(--muted);border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.li-del:hover,.li-del:focus-visible{color:var(--stamp);background:var(--sheet)}
.combo-pop li b{font-weight:600}
.combo-pop li span{font-size:.8125rem;color:var(--muted)}
.combo-pop li:hover,.combo-pop li:focus{background:var(--field);outline:none}
.combo-pop li[aria-selected="true"]{box-shadow:inset 3px 0 0 var(--pen)}
.combo-pop li.vuoto{cursor:default;color:var(--muted)}
.vocali{margin-top:6px}
.vnota{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 8px;margin-bottom:6px;background:var(--field);border:1.5px solid var(--line);border-radius:5px}
.vnota .vlab{font-size:.8125rem;color:var(--muted);font-weight:500}
.vnota audio{height:36px;flex:1 1 200px;max-width:100%}
.btn.rec{background:var(--stamp);border-color:var(--stamp);color:#fff}
.foto-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.cam-only{display:none}
@media (pointer:coarse){.cam-only{display:inline-flex;align-items:center}}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.photo{display:flex;flex-direction:column;gap:8px}
.photo .ph{aspect-ratio:4/3;background:var(--field);border:1.5px solid var(--line);border-radius:5px;display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--muted);font-size:.875rem}
.photo .ph img{width:100%;height:100%;object-fit:cover;display:block}
.photo textarea{min-height:60px!important}
.photo .btn{align-self:flex-start}
.actions{position:sticky;bottom:0;display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));background:var(--sheet);border-top:1.5px solid var(--line)}
.actions .g{display:flex;gap:8px;flex-wrap:wrap}
.modal{position:fixed;inset:0;background:rgba(10,15,25,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:30}
.modal-box{background:var(--sheet);color:var(--ink);border-radius:8px;box-shadow:var(--shadow);max-width:440px;width:100%;padding:20px}
.modal-box p{margin:0 0 18px;white-space:pre-line;line-height:1.5}
.modal-act{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.modal-in{width:100%;padding:9px 12px;border:1.5px solid var(--line);border-radius:5px;background:var(--field);color:var(--pen);font-size:1rem;font-weight:500;margin:-6px 0 16px}
.modal-in:focus{border-color:var(--pen);outline:none}
.btn.danger-fill{background:var(--stamp);border-color:var(--stamp);color:#fff}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--sheet);padding:10px 16px;border-radius:6px;font-weight:600;box-shadow:var(--shadow);z-index:20;max-width:90vw}
.note{font-size:.8125rem;color:var(--muted);margin:14px 0 0}
.hidden{display:none!important}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
@media (max-width:560px){
  header.top h1{font-size:1.45rem}
  .sheet-head h2{font-size:1.25rem}
  fieldset{padding:12px 14px 16px}
  .actions{padding-left:14px;padding-right:14px}
}
@media (prefers-reduced-motion:no-preference){ .toast{animation:tin .18s ease-out} @keyframes tin{from{opacity:0;transform:translate(-50%,8px)}} }
</style>

<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Rapportini d'intervento</h1>
      <p id="sub">Interventi tecnici presso il cliente</p>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn ghost hidden" id="bEsci">Esci</button>
      <button class="btn ghost" id="bSettings" aria-label="Dati azienda">Azienda</button>
      <button class="btn primary" id="bNew">Nuovo intervento</button>
    </div>
  </header>
  <div id="offline" class="banner ro hidden" role="status"><div><b>Sei offline.</b> Puoi continuare a compilare e salvare: i rapportini si sincronizzano appena torna la connessione.</div></div>
  <main id="app"><div class="loading">Caricamento…</div></main>
</div>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const app=$("#app");
const TRASH='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg>';
const CAMERA='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-3px;margin-right:4px"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';
const WA='<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="vertical-align:-3px;margin-right:4px"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1-.7-.3-1.4-.7-2-1.3-.6-.5-1-1.1-1.4-1.8-.1-.2 0-.4.1-.5l.4-.4.2-.4v-.4l-.8-1.9c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.4.1-.6.3-.6.6-.9 1.4-.9 2.2.1 1 .4 1.9 1 2.7 1.1 1.6 2.5 2.9 4.2 3.7.4.2.9.4 1.3.5.5.1 1 .1 1.5 0 .5-.1 1.4-.6 1.6-1.2.2-.5.2-.9.1-1.2l-.4-.2z"/></svg>';
const MIC='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-3px;margin-right:4px"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
const STOP='<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="vertical-align:-2px;margin-right:6px"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>';
const VOCE_MAX_SEC=180, VOCE_MAX_BYTES=6*1024*1024, VOCE_PDF="Nota vocale presente";
const fmtDur=sec=>{sec=Math.max(0,Math.round(sec||0));return Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0")};
const bloccoVocale=campo=>`<div class="vocali" data-campo="${campo}"><div class="vlist"></div><button type="button" class="btn ghost sm cam-only rec-btn" data-rec="${campo}">${MIC} Registra nota vocale</button></div>`;
const comboHtml=(id,label,name,value,list,cercaPh,vuota)=>`<div class="f combo-wrap"><label for="${id}">${label}</label>
  <div class="combo"><input id="${id}" name="${name}" list="dl-${id}" value="${esc(value)}" autocomplete="off">
    <button type="button" class="combo-btn" aria-haspopup="listbox" aria-expanded="false" aria-label="Mostra elenco ${label.toLowerCase()}"${list.length?"":" disabled"}>${CHEV}</button></div>
  <div class="combo-pop hidden"><input type="search" class="combo-cerca" placeholder="${cercaPh}" aria-label="${cercaPh}" autocomplete="off"><ul role="listbox" aria-label="${label}"></ul></div>
  <datalist id="dl-${id}">${list.map(v=>`<option value="${esc(v.valore)}">`).join("")}</datalist></div>`;
// elenco a tendina sempre disponibile, anche con il campo già compilato
function attivaCombo(wrap,voci,vuota,elimina){
  const inp=wrap.querySelector(".combo input"),btn=wrap.querySelector(".combo-btn"),pop=wrap.querySelector(".combo-pop"),cerca=pop.querySelector("input"),ul=pop.querySelector("ul");
  let ordinati=[...voci].sort((a,b)=>a.valore.localeCompare(b.valore,"it",{sensitivity:"base"}));
  const puoEliminare=!!elimina&&!store.readOnly;
  const disegna=()=>{
    const q=cerca.value.trim().toLowerCase(),att=inp.value.trim().toLowerCase();
    const vis=ordinati.filter(v=>!q||[v.valore,v.sotto||""].join(" ").toLowerCase().includes(q));
    ul.innerHTML=vis.map(v=>`<li role="option" tabindex="-1" data-v="${esc(v.valore)}" aria-selected="${v.valore.trim().toLowerCase()===att}"><div class="lv"><b>${esc(v.valore)}</b>${v.sotto?`<span>${esc(v.sotto)}</span>`:""}</div>${puoEliminare?`<button type="button" class="li-del" data-del="${esc(v.valore)}" aria-label="Rimuovi ${esc(v.valore)} dall'elenco" title="Rimuovi dall'elenco">${TRASH}</button>`:""}</li>`).join("")||`<li class="vuoto">${vuota}</li>`;
  };
  const fuori=e=>{if(!wrap.contains(e.target))chiudi()};
  const chiudi=()=>{pop.classList.add("hidden");btn.setAttribute("aria-expanded","false");document.removeEventListener("pointerdown",fuori,true)};
  const apri=()=>{cerca.value="";disegna();pop.classList.remove("hidden");btn.setAttribute("aria-expanded","true");document.addEventListener("pointerdown",fuori,true);cerca.focus()};
  btn.onclick=()=>pop.classList.contains("hidden")?apri():chiudi();
  cerca.oninput=disegna;
  const scegli=li=>{if(!li||li.dataset.v==null)return;inp.value=li.dataset.v;inp.dispatchEvent(new Event("input",{bubbles:true}));chiudi();inp.focus()};
  ul.onclick=async e=>{
    const d=e.target.closest(".li-del");
    if(d){
      e.stopPropagation();
      const val=d.dataset.del;
      document.removeEventListener("pointerdown",fuori,true); // la finestra di conferma non deve chiudere l'elenco
      const ok=await elimina(val);
      document.addEventListener("pointerdown",fuori,true);
      if(ok){
        ordinati=ordinati.filter(v=>v.valore!==val);
        const dl=wrap.querySelector("datalist");if(dl)[...dl.options].forEach(o=>{if(o.value===val)o.remove()});
        btn.disabled=!ordinati.length;disegna();
        if(!ordinati.length)chiudi();else cerca.focus();
      }
      return;
    }
    scegli(e.target.closest("li"));
  };
  pop.addEventListener("keydown",e=>{
    const items=[...ul.querySelectorAll("li[data-v]")],i=items.indexOf(document.activeElement);
    if(e.key==="Escape"){e.preventDefault();chiudi();btn.focus()}
    else if(e.key==="ArrowDown"){e.preventDefault();(items[i+1]||items[0])?.focus()}
    else if(e.key==="ArrowUp"){e.preventDefault();if(i<=0)cerca.focus();else items[i-1].focus()}
    else if(e.key==="Enter"){if(i>=0){e.preventDefault();scegli(items[i])}else if(items.length===1){e.preventDefault();scegli(items[0])}}
  });
}

// finestre di conferma interne alla pagina: confirm() e alert() del browser
// sono bloccati quando l'applicazione è aperta dal link pubblicato
function dialogo(msg,{ok="OK",cancel=null,danger=false,input=null}={}){
  return new Promise(res=>{
    const prev=document.activeElement;
    const ov=document.createElement("div");ov.className="modal";
    ov.innerHTML=`<div class="modal-box" role="alertdialog" aria-modal="true"><p></p>${input?`<input class="modal-in" type="text" autocomplete="name">`:""}<div class="modal-act">${cancel?`<button class="btn ghost" data-r="0"></button>`:""}<button class="btn ${danger?"danger-fill":"primary"}" data-r="1"></button></div></div>`;
    ov.querySelector("p").textContent=msg;
    ov.querySelector('[data-r="1"]').textContent=ok;
    if(cancel)ov.querySelector('[data-r="0"]').textContent=cancel;
    const fin=ov.querySelector(".modal-in"),okb=ov.querySelector('[data-r="1"]');
    if(fin){fin.placeholder=input.placeholder||"";fin.value=input.value||"";fin.setAttribute("aria-label",input.label||msg);
      const upd=()=>{okb.disabled=!fin.value.trim()};upd();fin.oninput=upd;
      fin.onkeydown=e=>{if(e.key==="Enter"&&fin.value.trim()){e.preventDefault();close(true)}}}
    const close=v=>{document.removeEventListener("keydown",key);const val=fin?fin.value.trim():null;ov.remove();if(prev&&prev.focus)prev.focus();res(fin?(v?val:null):v)};
    const key=e=>{if(e.key==="Escape")close(false)};
    ov.addEventListener("click",e=>{const r=e.target.dataset&&e.target.dataset.r;if(r!=null)close(r==="1");else if(e.target===ov&&cancel)close(false)});
    document.addEventListener("keydown",key);
    document.body.appendChild(ov);
    (fin||ov.querySelector(cancel?'[data-r="0"]':'[data-r="1"]')).focus();
  });
}
const chiedi=(msg,o={})=>dialogo(msg,{cancel:"Annulla",...o});
const avviso=msg=>dialogo(msg,{ok:"Ho capito"});

// sezioni apribili/richiudibili con freccia; quali partono aperte lo decide chi apre il modulo
const CHEV='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
function rendiApribili(form,riepilogo,apertaAllInizio=()=>true){
  const sezioni=[...form.querySelectorAll(":scope > fieldset")];
  sezioni.forEach((fs,i)=>{
    const lg=fs.querySelector(":scope > legend");if(!lg)return;
    const titolo=lg.textContent.trim(),bodyId=(form.id||"f")+"-sez-"+i;
    const body=document.createElement("div");body.className="sez-body";body.id=bodyId;
    while(lg.nextSibling)body.appendChild(lg.nextSibling);
    fs.appendChild(body);
    lg.innerHTML="";
    const bt=document.createElement("button");bt.type="button";bt.className="sez-toggle";bt.setAttribute("aria-controls",bodyId);
    bt.innerHTML=`<span class="tit"></span><span class="riep"></span><span class="chev">${CHEV}</span>`;
    bt.querySelector(".tit").textContent=titolo;
    lg.appendChild(bt);
    const set=chiusa=>{
      fs.classList.toggle("chiusa",chiusa);bt.setAttribute("aria-expanded",String(!chiusa));
      if(chiusa&&riepilogo)bt.querySelector(".riep").textContent=riepilogo(titolo)||"";
    };
    fs._apri=()=>{if(fs.classList.contains("chiusa")){set(false);window.dispatchEvent(new Event("resize"))}};
    fs._chiudi=()=>set(true);
    bt.onclick=()=>fs.classList.contains("chiusa")?fs._apri():fs._chiudi();
    set(!apertaAllInizio(titolo));
  });
  // apri tutto / chiudi tutto
  const bar=document.createElement("div");bar.className="sez-all";
  bar.innerHTML=`<button type="button" class="btn ghost sm" data-a="1">Apri tutto</button><button type="button" class="btn ghost sm" data-a="0">Chiudi tutto</button>`;
  bar.onclick=e=>{const a=e.target.dataset.a;if(a==null)return;sezioni.forEach(fs=>a==="1"?fs._apri&&fs._apri():fs._chiudi&&fs._chiudi())};
  if(sezioni[0])form.insertBefore(bar,sezioni[0]);
  // un campo che riceve il focus apre la sua sezione
  form.addEventListener("focusin",e=>{const fs=e.target.closest&&e.target.closest("fieldset.chiusa");if(fs&&fs._apri&&!e.target.classList.contains("sez-toggle"))fs._apri()});
}

function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.remove("hidden");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.add("hidden"),2400)}

/* ---------- storage: cloud db when available, browser storage otherwise ---------- */
const LS_KEY="interventi-v1", LS_CFG="interventi-cfg-v1";
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
// offline le scritture restano in coda nel telefono e partono al ritorno della connessione:
// non si aspetta la conferma del server più di qualche secondo
const scrivi=p=>p; // le scritture fuori rete vanno già in coda sul telefono
const store={mode:"local",readOnly:false,db:null,user:null,me:null,col:null,cfgRef:null,oldCol:null,oldCfg:null,
  async init(user){
    // server in rete locale: archivio condiviso tra tutti gli utenti, con copia sul telefono per lavorare fuori ufficio
    const db=LocalDB.db;
    this.db=db;this.me=user.uid;this.utente=user;
    this.col=db.collection("interventi");
    this.cfgRef=db.doc("config/azienda");
    this.mode="cloud";
    this.accesso={email:user.email,nome:user.nome||""};
  },
  lsGet(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def}catch(e){return def}},
  lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}},
  docsToItems(snap){return snap.docs.map(d=>normStato({...d.data(),id:d.id})).filter(x=>x.numero||x.inAttesaNumero)},
  async list(){
    if(this.mode==="cloud")return this.docsToItems(await this.col.get());
    return this.lsGet(LS_KEY,[]).map(normStato);
  },
  subscribe(cb){
    if(this.mode!=="cloud")return;
    this.col.onSnapshot(snap=>{cb(this.docsToItems(snap));if(!snap.metadata.fromCache)numeraInAttesa()},e=>console.warn("aggiornamento automatico interrotto",e));
  },
  // salva controllando che nessun collega abbia modificato il rapportino nel frattempo
  async save(it,loadedAt,force){
    if(this.mode==="cloud"){
      const ref=this.col.doc(it.id);
      if(!force){
        const cur=await ref.get();const d=cur.exists?cur.data():null;
        if(d&&(d.numero||d.inAttesaNumero)&&d.updatedAt!==loadedAt){const err=new Error("conflitto");err.code="conflict";err.other=d;throw err}
        if(loadedAt&&!(d&&(d.numero||d.inAttesaNumero))){const err=new Error("eliminato");err.code="deleted";throw err}
      }
      it.updatedAt=Date.now();
      if(this.me){if(!it.creatoDa){it.creatoDa=this.me;it.creatoDaNome=this.accesso.nome||this.accesso.email}it.modificatoDa=this.me;it.modificatoDaNome=this.accesso.nome||this.accesso.email}
      const {id,...rest}=it;await scrivi(ref.set(rest));return;
    }
    it.updatedAt=Date.now();
    const all=this.lsGet(LS_KEY,[]);const i=all.findIndex(x=>x.id===it.id);
    if(i>=0)all[i]=it;else all.push(it);
    if(!this.lsSet(LS_KEY,all))throw new Error("Spazio del browser esaurito");
  },
  async remove(id){
    if(this.mode==="cloud"){await scrivi(this.col.doc(id).delete());return}
    this.lsSet(LS_KEY,this.lsGet(LS_KEY,[]).filter(x=>x.id!==id));
  },
  // numero progressivo unico anche se due tecnici salvano nello stesso momento
  async assignNumero(year){
    const maxItems=items.filter(i=>(i.numero||"").startsWith(year+"/")).reduce((m,i)=>Math.max(m,parseInt(i.numero.split("/")[1])||0),0);
    const n=await LocalDB.contatore(year,maxItems);
    return `${year}/${String(n).padStart(3,"0")}`;
  },
  async alignCounter(year,n){await LocalDB.contatore(year,n,true)},
  // fotografie: una per documento, fuori dal rapportino per restare sotto i limiti di dimensione
  fotoRef(iid,fid){return this.col.doc(iid).collection("foto").doc(fid)},
  async getFoto(iid,fid){
    if(this.mode==="cloud"){const s=await this.fotoRef(iid,fid).get();const d=s.data();return d?d.data:""}
    return this.lsGet("interventi-foto:"+iid+":"+fid,"");
  },
  async setFoto(iid,fid,data){
    if(this.mode==="cloud"){await scrivi(this.fotoRef(iid,fid).set({data}));return}
    if(!this.lsSet("interventi-foto:"+iid+":"+fid,data))throw new Error("Spazio del browser esaurito per le fotografie");
  },
  async delFoto(iid,fid){
    if(this.mode==="cloud"){await scrivi(this.fotoRef(iid,fid).delete());return}
    try{localStorage.removeItem("interventi-foto:"+iid+":"+fid)}catch(e){}
  },
  // note vocali: divise in parti per restare sotto il limite di dimensione di ogni documento
  audioCol(iid){return this.col.doc(iid).collection("audio")},
  async setAudio(iid,aid,data){
    const CH=200000,n=Math.max(1,Math.ceil(data.length/CH));
    if(this.mode==="cloud"){for(let i=0;i<n;i++)await scrivi(this.audioCol(iid).doc(aid+"_"+i).set({data:data.slice(i*CH,(i+1)*CH)}));return n}
    if(!this.lsSet("interventi-audio:"+iid+":"+aid,data))throw new Error("Spazio del browser esaurito per le note vocali");
    return 1;
  },
  async getAudio(iid,aid,parti){
    if(this.mode==="cloud"){let out="";for(let i=0;i<(parti||1);i++){const d=(await this.audioCol(iid).doc(aid+"_"+i).get()).data();if(!d)break;out+=d.data}return out}
    return this.lsGet("interventi-audio:"+iid+":"+aid,"");
  },
  async delAudio(iid,aid,parti){
    if(this.mode==="cloud"){for(let i=0;i<(parti||1);i++)await scrivi(this.audioCol(iid).doc(aid+"_"+i).delete()).catch(()=>{});return}
    try{localStorage.removeItem("interventi-audio:"+iid+":"+aid)}catch(e){}
  },
  // voci tolte dagli elenchi a tendina (i rapportini salvati non cambiano)
  async getNascosti(){
    let d;
    if(this.mode==="cloud")d=(await this.db.doc("config/elenchi").get()).data();
    else d=this.lsGet("interventi-elenchi",null);
    return{clienti:(d&&d.clienti)||[],macchine:(d&&d.macchine)||[],tecnici:(d&&d.tecnici)||[]};
  },
  async setNascosti(n){
    if(this.mode==="cloud"){await scrivi(this.db.doc("config/elenchi").set(n));return}
    this.lsSet("interventi-elenchi",n);
  },
  async getCfg(){
    if(this.mode==="cloud"){const s=await this.cfgRef.get();return s.data()||{}}
    return this.lsGet(LS_CFG,{});
  },
  async setCfg(c){if(this.mode==="cloud"){await scrivi(this.cfgRef.set(c));return}this.lsSet(LS_CFG,c)},
  // rapportini rimasti nello spazio personale prima del passaggio all'archivio comune
  async personali(){
    if(!this.oldCol)return[];
    try{return this.docsToItems(await this.oldCol.get())}catch(e){return[]}
  },
  async migra(lista,onProgress){
    const anni={};let spostati=0;
    lista.sort((a,b)=>(a.numero||"").localeCompare(b.numero||""));
    for(const old of lista){
      const it={...old};
      const usato=items.some(i=>i.numero===it.numero&&i.id!==it.id);
      if(usato||!it.numero)it.numero=await this.assignNumero((it.data||today()).slice(0,4));
      for(const f of (it.foto||[])){
        const s=await this.oldCol.doc(old.id).collection("foto").doc(f.id).get();const d=s.data();
        if(d&&d.data)await this.fotoRef(it.id,f.id).set({data:d.data});
      }
      if(this.me&&!it.creatoDa)it.creatoDa=this.me;
      it.updatedAt=Date.now();
      const {id,...rest}=it;await this.col.doc(it.id).set(rest);
      items=items.filter(x=>x.id!==it.id).concat([it]);
      for(const f of (it.foto||[]))await this.oldCol.doc(old.id).collection("foto").doc(f.id).delete().catch(()=>{});
      await this.oldCol.doc(old.id).delete();
      const [y,n]=it.numero.split("/");anni[y]=Math.max(anni[y]||0,parseInt(n)||0);
      spostati++;onProgress&&onProgress(spostati,lista.length);
    }
    for(const [y,n] of Object.entries(anni))await this.alignCounter(y,n);
    try{
      const shared=await this.getCfg();
      if(!shared.nome){const o=(await this.oldCfg.get()).data();if(o&&o.nome){await this.setCfg(o);cfg=o}}
    }catch(e){}
    return spostati;
  }
};
// nomi delle persone (mai salvati: si risolvono dall'id al momento della visualizzazione)
const nomi={};
async function caricaNomi(ids){
  ids=[...new Set(ids.filter(x=>x&&!(x in nomi)))];
  if(!ids.length||!store.db)return;
  await Promise.all(ids.map(async id=>{
    if(id===store.me){nomi[id]="te";return}
    try{const d=(await store.db.doc("utenti/"+id).get()).data();if(d&&d.nome)nomi[id]=d.nome}catch(e){}
    if(!nomi[id]){const r=items.find(i=>i.creatoDa===id&&i.creatoDaNome)||items.find(i=>i.modificatoDa===id&&i.modificatoDaNome);
      if(r)nomi[id]=r.creatoDa===id?r.creatoDaNome:r.modificatoDaNome}
  }));
}
const nome=id=>id?(nomi[id]||"un collega"):"";

let items=[],cfg={},filtro={q:"",stato:""},view="list",personali=[];

function minuti(it){
  if(!it.oraInizio||!it.oraFine)return 0;
  const[a,b]=it.oraInizio.split(":").map(Number),[c,d]=it.oraFine.split(":").map(Number);
  let m=(c*60+d)-(a*60+b); if(m<0)m+=1440;
  return Math.max(0,m-(Number(it.pausa)||0));
}
const hhmm=m=>`${Math.floor(m/60)}h ${String(m%60).padStart(2,"0")}m`;
const oreDec=m=>(m/60).toLocaleString("it-IT",{minimumFractionDigits:2,maximumFractionDigits:2});

/* ---------- list view ---------- */

  if(!items.length){
    app.innerHTML=`<div class="empty"><h2>Nessun intervento registrato</h2><p>Compila il primo rapportino: dati cliente, ore, materiali e firma direttamente dal telefono.</p><button class="btn primary" id="eNew">Nuovo intervento</button></div>${migraBanner()}${storageNote()}`;

  <div class="toolbar">

    <select id="fs" aria-label="Filtra per stato"><option value="">Tutti gli stati</option>${Object.entries(STATI).map(([k,v])=>`<option value="${k}" ${filtro.stato===k?"selected":""}>${v}</option>`).join("")}</select>
    <button class="btn ghost" id="bCsv">Esporta CSV</button>
  </div>
  <div class="list">${vis.map(i=>`
    <div class="rowwrap"><button class="row" data-id="${esc(i.id)}">
      <span class="num">${i.numero?esc(i.numero):"in attesa"}</span>
      <span class="who">${esc(i.cliente?.nome||"Cliente senza nome")}</span>
      <span class="stamp s-${esc(i.stato)}">${esc(STATI[i.stato]||i.stato)}</span>
      <span class="meta">${fmtData(i.data)} · ${i.codAssistenza?"Cod. "+esc(i.codAssistenza)+" · ":""}${esc(i.tipo||"")}${i.tecnico?" · "+esc(i.tecnico):""} · ${hhmm(minuti(i))}</span>
    </button>${store.readOnly?"":`<button class="rowdel" data-del="${esc(i.id)}" aria-label="Elimina rapportino ${esc(i.numero)}" title="Elimina rapportino">${TRASH}</button>`}</div>`).join("")||`<p class="note">Nessun intervento corrisponde alla ricerca.</p>`}
  </div>${storageNote()}`;
  bindMigra();
  const qi=$("#q");qi.oninput=()=>{filtro.q=qi.value;const p=qi.selectionStart;renderList();const n=$("#q");n.focus();n.setSelectionRange(p,p)};
  $("#fs").onchange=e=>{filtro.stato=e.target.value;renderList()};
  $("#bCsv").onclick=exportCsv;
  app.querySelectorAll(".row").forEach(r=>r.onclick=async()=>{
    const it=items.find(i=>i.id===r.dataset.id);if(!it)return;
    if(it.stato==="completato"&&!await chiedi(`Il rapportino ${it.numero}${it.cliente?.nome?" ("+it.cliente.nome+")":""} è già concluso.\n\nVuoi aprirlo comunque?`,{ok:"Apri rapportino"}))return;
    openForm(it);
  });
  app.querySelectorAll(".rowdel").forEach(b=>b.onclick=()=>eliminaRapportino(items.find(i=>i.id===b.dataset.del),b));

async function eliminaRapportino(it,btn){
  if(!it)return;
  if(!await chiedi(`Eliminare definitivamente il rapportino ${it.numero}${it.cliente?.nome?" ("+it.cliente.nome+")":""}?\n\nL'operazione non si può annullare e vale per tutti gli utenti dell'archivio.`,{ok:"Elimina",danger:true}))return;
  if(btn)btn.disabled=true;
  try{
    for(const f of (it.foto||[]))await store.delFoto(it.id,f.id).catch(()=>{});
    for(const v of (it.vocali||[]))await store.delAudio(it.id,v.id,v.parti).catch(()=>{});
    await store.remove(it.id);
    items=items.filter(x=>x.id!==it.id);toast(`Rapportino ${it.numero} eliminato`);renderList();
  }catch(e){
    if(btn)btn.disabled=false;
    await avviso("Eliminazione non riuscita.\n\nDettaglio tecnico: "+(e.code||"")+" "+(e.message||""));
  }
}
const chiave=v=>String(v||"").trim().toLowerCase();
async function nascondiVoce(tipo,valore){
  const etichetta={clienti:"il cliente",macchine:"il tipo macchina",tecnici:"il tecnico"}[tipo];
  if(!await chiedi(`Rimuovere ${etichetta} "${valore}" dall'elenco?\n\nI rapportini già salvati non cambiano. Se in futuro salvi un rapportino con questo nome, tornerà nell'elenco.`,{ok:"Rimuovi",danger:true}))return false;
  try{
    const n=await store.getNascosti();
    if(!n[tipo].includes(chiave(valore)))n[tipo].push(chiave(valore));
    await store.setNascosti(n);nascosti=n;toast("Voce rimossa dall'elenco");return true;
  }catch(e){await avviso("Rimozione non riuscita.\n\nDettaglio tecnico: "+(e.code||"")+" "+(e.message||""));return false}
}
async function rendiVisibili(it){ // un nome usato di nuovo in un rapportino salvato torna nell'elenco
  const c=chiave(it.cliente?.nome),m=chiave(it.tipoMacchina),t=chiave(it.tecnico);
  if(!nascosti.clienti.includes(c)&&!nascosti.macchine.includes(m)&&!nascosti.tecnici.includes(t))return;
  try{const n=await store.getNascosti();n.clienti=n.clienti.filter(x=>x!==c);n.macchine=n.macchine.filter(x=>x!==m);n.tecnici=n.tecnici.filter(x=>x!==t);await store.setNascosti(n);nascosti=n}catch(e){}
}
let numerando=false;
async function numeraInAttesa(){
  if(numerando||!statoRete.online||!store.me)return;numerando=true;
  try{
    for(const it of items.filter(i=>i.inAttesaNumero&&!i.numero&&i.creatoDa===store.me)){
      const numero=await store.assignNumero((it.data||today()).slice(0,4));
      await scrivi(store.col.doc(it.id).update({numero,inAttesaNumero:LocalDB.ELIMINA}));
      toast(`Numero ${numero} assegnato al rapportino di ${it.cliente?.nome||"cliente"}`);
    }
  }catch(e){console.warn("numerazione rimandata",e)}finally{numerando=false}
}
let statoRete={online:true,inCoda:0};
LocalDB.ascoltaStato(st=>{const prima=statoRete.online;statoRete=st;aggiornaRete();if(st.online&&!prima)numeraInAttesa()});
function aggiornaRete(){
  const b=$("#offline");if(!b)return;
  b.classList.toggle("hidden",statoRete.online&&!statoRete.inCoda);
  b.querySelector("div").innerHTML=!statoRete.online
    ?`<b>Server dell'ufficio non raggiungibile.</b>${NATIVO?" Controlla che Tailscale sia attivo.":""} Puoi continuare a compilare e salvare: i rapportini restano sul telefono e vengono inviati appena sei di nuovo collegato alla rete aziendale${statoRete.inCoda?` (${statoRete.inCoda} modifiche in attesa)`:""}.`

function storageNote(){

function bindMigra(){
  const b=$("#bMigra");if(!b)return;

  };
}

    const d=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(blob)});
    const id="v"+uid();audioData[id]=d;audioNuove.add(id);

  let rec=null;
  const avviaRegistrazione=async(campo,btn)=>{

    catch(e){ // microfono non accessibile dalla pagina: si usa il registratore del telefono

    const mime=["audio/webm;codecs=opus","audio/mp4","audio/webm","audio/ogg;codecs=opus"].find(m=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m))||"";
    let mr;try{mr=new MediaRecorder(stream,mime?{mimeType:mime,audioBitsPerSecond:24000}:{audioBitsPerSecond:24000})}catch(e){mr=new MediaRecorder(stream)}
    const parti=[],t0=Date.now();
    mr.ondataavailable=e=>{if(e.data&&e.data.size)parti.push(e.data)};

  if(!isNew)$("#bDel").onclick=async()=>{

/* ---------- app Android (Capacitor) ---------- */
const NATIVO=!!(window.Capacitor&&typeof Capacitor.isNativePlatform==="function"&&Capacitor.isNativePlatform());
const _plug={};
function plug(n){
  if(!NATIVO)return null;
  if(_plug[n])return _plug[n];
  const reg=(window.capacitorExports&&capacitorExports.registerPlugin)||Capacitor.registerPlugin;
  return _plug[n]=(Capacitor.Plugins&&Capacitor.Plugins[n])||reg(n);
}
const blobBase64=b=>new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(",")[1]);r.onerror=ko;r.readAsDataURL(b)});
// scrive il file nella memoria temporanea dell'app e ne restituisce il percorso
async function fileNativo(nome,blob){
  const fs=plug("Filesystem");
  const r=await fs.writeFile({path:"rapportini/"+nome,data:await blobBase64(blob),directory:"CACHE",recursive:true});
  return r.uri;
}
async function condividiNativo(nome,blob,titolo){
  const uri=await fileNativo(nome,blob);
  try{await plug("Share").share({title:titolo||nome,files:[uri],dialogTitle:titolo||"Condividi"})}
  catch(e){if(!/cancel/i.test(String(e&&e.message)))throw e}
}

// rapportino salvato senza connessione: il PDF esce con un numero provvisorio,
// quello definitivo arriva appena il telefono raggiunge il server
function perPdf(it){
  if(it.numero)return it;
  if(it.inAttesaNumero){
    toast("Senza connessione: PDF con numero provvisorio");
    return{...it,numero:"P-"+String(it.id||"").slice(-5).toUpperCase(),numeroProvvisorio:true};
  }
  toast("Salva l'intervento prima: il numero viene assegnato al salvataggio");
  return null;
}
function numeroWhatsApp(tel){
  let d=String(tel||"").replace(/[^\d+]/g,"");
  if(d.startsWith("+"))return d.slice(1);
  if(d.startsWith("00"))return d.slice(2);
  if(d.length>=9&&d.length<=11&&(d.startsWith("3")||d.startsWith("0")))return "39"+d; // numero italiano senza prefisso
  return d;
}
async function inviaWhatsApp(it,fotoData){
  const pdf=creaPdf(it,fotoData);if(!pdf)return;
  if(NATIVO){
    // app Android: il PDF viene passato direttamente a WhatsApp, che si apre sulla scelta del contatto
    try{
      const uri=await fileNativo(pdf.name,pdf.blob);
      try{await plug("WhatsappShare").sharePdf({path:uri});return}
      catch(e){
        if(e&&e.code!=="NO_WHATSAPP")console.warn("invio diretto non riuscito",e);
        if(e&&e.code==="NO_WHATSAPP")toast("WhatsApp non è installato: scegli un'altra app");
        await plug("Share").share({title:`Rapportino ${it.numero}`,files:[uri],dialogTitle:"Invia rapportino"}).catch(x=>{if(!/cancel/i.test(String(x&&x.message)))throw x});
        return;
      }
    }catch(e){await avviso("Invio non riuscito.\n\nDettaglio tecnico: "+(e.code||"")+" "+(e.message||e));return}
  }
  const testo=`Rapportino d'intervento n. ${it.numero} del ${fmtData(it.data)}${it.cliente.nome?" - "+it.cliente.nome:""}${cfg.nome?"\n"+cfg.nome:""}`;
  // 1) PDF allegato direttamente: si apre il menu Condividi del telefono con il file già pronto, si tocca WhatsApp
  const file=new File([pdf.blob],pdf.name,{type:"application/pdf"});
  const puo=window.isSecureContext&&navigator.canShare&&navigator.canShare({files:[file]});
  if(puo){
    // solo il file: se insieme al PDF si passa anche un testo, WhatsApp su Android invia il testo e scarta l'allegato
    const condividi=async()=>{await navigator.share({files:[file]});toast("Rapportino inviato")};
    try{await condividi();return}
    catch(e){
      if(e&&e.name==="AbortError")return;
      // la preparazione del PDF (con le foto) ha richiesto troppo tempo: il telefono chiede un nuovo tocco
      if(e&&e.name==="NotAllowedError"){
        if(!await chiedi("Il PDF del rapportino è pronto.",{ok:"Invia su WhatsApp",cancel:"Annulla"}))return;
        try{await condividi();return}catch(e2){if(e2&&e2.name==="AbortError")return;console.warn(e2)}
      }else console.warn("condivisione diretta non disponibile",e);
    }
  }
  // 2) alternativa: salva il PDF e apre la chat WhatsApp con il messaggio già scritto
  await saveFile(pdf.name,pdf.blob);
  const n=numeroWhatsApp(it.cliente.telefono);
  const url=`https://wa.me/${n}?text=${encodeURIComponent(testo)}`;
  if(!window.isSecureContext)await avviso("Per allegare il PDF a WhatsApp in automatico l'applicazione deve essere aperta con un indirizzo https:// (vedi LEGGIMI, sezione HTTPS).\n\nPer ora il PDF viene scaricato e va allegato a mano.");
  const ok=await chiedi(`Il PDF è stato salvato nei download.\n\nOra apri WhatsApp${n?" sulla chat del cliente ("+it.cliente.telefono+")":""}: il messaggio è già scritto, ti basta allegare il file ${pdf.name} con la graffetta.`,{ok:"Apri WhatsApp",cancel:"Chiudi"});
  if(ok){const a=document.createElement("a");a.href=url;a.target="_blank";a.rel="noopener";document.body.appendChild(a);a.click();a.remove()}
}

function sigPad(cv,initial,onChange){
  const ctx=cv.getContext("2d");let drawing=false,last=null,current=initial||"";
  const ink=()=>getComputedStyle(document.documentElement).getPropertyValue("--pen").trim()||"#2340B8";
  function size(){
    const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
    cv.width=Math.max(1,r.width*dpr);cv.height=Math.max(1,r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.lineWidth=2.2;ctx.lineCap="round";ctx.lineJoin="round";
    if(current){const img=new Image();img.onload=()=>{ctx.globalCompositeOperation="source-over";ctx.drawImage(img,0,0,r.width,r.height);
      ctx.globalCompositeOperation="source-in";ctx.fillStyle=ink();ctx.fillRect(0,0,r.width,r.height);ctx.globalCompositeOperation="source-over"};img.src=current}
  }
  size();
  const pos=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
  cv.addEventListener("pointerdown",e=>{drawing=true;last=pos(e);cv.setPointerCapture(e.pointerId);ctx.strokeStyle=ink();ctx.beginPath();ctx.arc(last.x,last.y,1,0,7);ctx.fillStyle=ink();ctx.fill()});
  cv.addEventListener("pointermove",e=>{if(!drawing)return;const p=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p});
  const end=()=>{if(!drawing)return;drawing=false;current=exportSig();onChange(current)};
  cv.addEventListener("pointerup",end);cv.addEventListener("pointercancel",end);
  function exportSig(){ // dark ink on transparent, scaled down to keep saved data small
    const w=500,h=Math.round(500*cv.height/cv.width),o=document.createElement("canvas");o.width=w;o.height=h;
    const c=o.getContext("2d");c.drawImage(cv,0,0,w,h);
    c.globalCompositeOperation="source-in";c.fillStyle="#1B2E80";c.fillRect(0,0,w,h);
    return o.toDataURL("image/png");
  }
  let rt;window.addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{if(document.body.contains(cv))size()},150)});
  return{clear(){current="";ctx.clearRect(0,0,cv.width,cv.height)}};
}

async function saveFile(filename,data){
  if(NATIVO){
    // nell'app i file si aprono nel menu Condividi: da lì si salvano (Drive, File), si inviano o si stampano
    try{const blob=data instanceof Blob?data:new Blob([data],{type:"text/plain"});await condividiNativo(filename,blob,filename)}
    catch(e){toast("File non salvato: "+(e.message||e))}
    return;
  }
  try{
    const blob=data instanceof Blob?data:new Blob([data],{type:filename.endsWith(".csv")?"text/csv;charset=utf-8":"application/octet-stream"});
    const url=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),60000);
    toast("File scaricato: "+filename);
  }catch(e){toast("File non salvato: "+(e.message||e))}
}
function exportCsv(){
  const cols=["Numero","Codice assistenza","Data","Cliente","Indirizzo","Referente","Telefono","Tecnico","Tipo","Tipo macchina","Matricola","Garanzia","Stato","Inizio","Fine","Pausa min","Ore","Viaggio min","Km","Problema","Lavori eseguiti","Materiali","Note"];
  const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const rows=[...items].sort((a,b)=>(a.numero||"").localeCompare(b.numero||"")).map(i=>[i.numero,i.codAssistenza,fmtData(i.data),i.cliente?.nome,i.cliente?.indirizzo,i.cliente?.referente,i.cliente?.telefono,i.tecnico,i.tipo,i.tipoMacchina,i.matricola,i.garanzia||"DA DEFINIRE",STATI[i.stato],i.oraInizio,i.oraFine,i.pausa,oreDec(minuti(i)),i.viaggio,i.km,i.problema,i.lavori,(i.materiali||[]).map(m=>`${m.q} x ${m.cod?m.cod+" ":""}${m.desc}`).join(" | "),i.note].map(q).join(";"));
  saveFile(`interventi_${today()}.csv`,"\uFEFF"+[cols.map(q).join(";"),...rows].join("\r\n"));

function comprimiFoto(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{
      URL.revokeObjectURL(url);
      let max=1400,q=.72,out="";
      for(let t=0;t<6;t++){
        const r=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
        const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*r);c.height=Math.round(img.naturalHeight*r);
        const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
        out=c.toDataURL("image/jpeg",q);
        if(out.length<230000)break;
        max=Math.round(max*.8);q=Math.max(.5,q-.06);
      }
      res(out);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("formato non supportato"))};
    img.src=url;
  });
}
function downloadReport(it,fotoData={}){const p=creaPdf(it,fotoData);if(p)saveFile(p.name,p.blob)}
function creaPdf(it,fotoData={}){
  const J=window.jspdf&&window.jspdf.jsPDF;
  if(!J){toast("Generatore PDF non caricato: controlla la connessione e riprova");return null}
  const doc=new J({unit:"mm",format:"a4"});
  const W=210,M=15,CW=W-2*M,BOTTOM=282;let y=M;
  const txt=(v)=>String(v??"").replace(/[\u2014\u2013]/g,"-").replace(/[\u2018\u2019]/g,"'").replace(/[\u201C\u201D]/g,'"');
  const need=h=>{if(y+h>BOTTOM){doc.addPage();y=M;footer()}};
  const footer=()=>{const p=doc.getNumberOfPages();doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(120);
    doc.text(txt(`Rapportino n. ${it.numero} - pagina ${p}`),W-M,292,{align:"right"});doc.setTextColor(0)};
  const lbl=(t,x,yy)=>{doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(95);doc.text(txt(t),x,yy);doc.setTextColor(0)};
  footer();

  // header
  doc.setFont("helvetica","bold");doc.setFontSize(16);doc.text("Rapporto di intervento tecnico",M,y+5);
  doc.setFont("helvetica","normal");doc.setFontSize(10);doc.text(txt(`N. ${it.numero}${it.numeroProvvisorio?" (provvisorio)":""} del ${fmtData(it.data)}`),M,y+11);
  doc.setFont("helvetica","bold");doc.text(txt(`Codice assistenza: ${it.codAssistenza||""}`),M,y+16);doc.setFont("helvetica","normal");
  const az=[cfg.nome,cfg.indirizzo,cfg.piva?"P.IVA "+cfg.piva:"",cfg.telefono,cfg.email].filter(Boolean).map(txt);
  const LW=45,LH=LW*191/400;
  try{doc.addImage(LOGO,"JPEG",W-M-LW,y-3,LW,LH)}catch(e){}
  const logoBottom=y-3+LH;
  if(az.length){doc.setFontSize(9);let ay=logoBottom+4;az.forEach((l,i)=>{doc.setFont("helvetica",i===0?"bold":"normal");doc.splitTextToSize(l,75).forEach(x=>{doc.text(x,W-M,ay,{align:"right"});ay+=4})});y=Math.max(y+20,ay)}else y=Math.max(y+20,logoBottom+3);
  doc.setLineWidth(.6);doc.line(M,y,W-M,y);y+=6;

  // two boxes: cliente / intervento
  const half=(CW-6)/2;
  const cl=[it.cliente.nome,it.cliente.indirizzo,it.cliente.referente?"Ref. "+it.cliente.referente:"",[it.cliente.telefono,it.cliente.email].filter(Boolean).join("  ")].filter(Boolean);
  const iv=([it.tipo,it.tipoMacchina?"Tipo macchina: "+it.tipoMacchina:"",it.matricola?"Matricola: "+it.matricola:"","Garanzia: "+(it.garanzia||"DA DEFINIRE"),"Tecnico: "+(it.tecnico||"-"),"Stato: "+STATI[it.stato]]).filter(Boolean);
  doc.setFontSize(10);
  const wrapL=arr=>arr.flatMap(l=>doc.splitTextToSize(txt(l),half-6));
  const L1=wrapL(cl),L2=wrapL(iv);const bh=Math.max(L1.length,L2.length)*4.6+10;
  doc.setLineWidth(.2);doc.setDrawColor(150);
  [[M,"Cliente",L1],[M+half+6,"Intervento",L2]].forEach(([x,t,L])=>{doc.rect(x,y,half,bh);lbl(t,x+3,y+4.5);
    let ly=y+9.5;L.forEach((l,i)=>{doc.setFont("helvetica",((t==="Cliente"&&i===0)||l.startsWith("Garanzia:"))?"bold":"normal");doc.setFontSize(10);doc.text(l,x+3,ly);ly+=4.6})});
  y+=bh+6;

  // orari table
  const m=minuti(it);
  const head=["Inizio","Fine","Pausa","Ore lavorate","Viaggio","Km"];
  const vals=[it.oraInizio||"-",it.oraFine||"-",(it.pausa||0)+" min",`${hhmm(m)} (${oreDec(m)})`,it.viaggio?it.viaggio+" min":"-",it.km||"-"];
  const cw=[24,24,24,48,30,CW-150];
  let x=M;doc.setFillColor(236,236,236);doc.rect(M,y,CW,6,"F");
  head.forEach((h,i)=>{lbl(h,x+2,y+4.2);doc.rect(x,y,cw[i],13);x+=cw[i]});
  x=M;doc.setFontSize(10);vals.forEach((v,i)=>{doc.setFont("helvetica",i===3?"bold":"normal");doc.text(txt(v),x+2,y+10.5);x+=cw[i]});
  y+=19;

  // text boxes
  const box=(title,body,vocale)=>{
    doc.setFont("helvetica","normal");doc.setFontSize(10);
    const hasTxt=!!String(body||"").trim();
    const lines=hasTxt?doc.splitTextToSize(txt(body),CW-6):(vocale?[]:["-"]);
    if(vocale){if(lines.length)lines.push("");lines.push("\u0000VOC")}
    let i=0,first=true;
    while(i<lines.length||first){
      need(16);const room=Math.max(1,Math.floor((BOTTOM-y-9)/4.6));const chunk=lines.slice(i,i+room);
      const h=chunk.length*4.6+9;doc.rect(M,y,CW,h);lbl(first?title:title+" (segue)",M+3,y+4.5);
      doc.setFont("helvetica","normal");doc.setFontSize(10);let ly=y+9.5;chunk.forEach(l=>{if(l==="\u0000VOC"){doc.setFont("helvetica","bold");doc.text(VOCE_PDF,M+3,ly);doc.setFont("helvetica","normal")}else doc.text(l,M+3,ly);ly+=4.6});
      y+=h+5;i+=chunk.length;first=false;
    }
  };
  const haVoce=c=>(it.vocali||[]).some(v=>v.campo===c);
  box("Problema segnalato",it.problema,haVoce("problema"));
  box("Lavori eseguiti",it.lavori,haVoce("lavori"));

  // materiali
  const mat=(it.materiali||[]).filter(r=>(r.desc||r.cod||"").trim());
  if(mat.length){
    const mw=[18,40,CW-58];
    const hdr=()=>{need(14);doc.setFillColor(236,236,236);doc.rect(M,y,CW,6,"F");let xx=M;["Q.tà","Codice","Materiale"].forEach((h,i)=>{lbl(h,xx+2,y+4.2);doc.rect(xx,y,mw[i],6);xx+=mw[i]});y+=6};
    need(20);doc.setFont("helvetica","bold");doc.setFontSize(11);doc.text("MATERIALE UTILIZZATO",M,y+4);y+=7;
    hdr();
    mat.forEach(r=>{
      doc.setFont("helvetica","normal");doc.setFontSize(10);
      const cells=[doc.splitTextToSize(txt(r.q),mw[0]-4),doc.splitTextToSize(txt(r.cod),mw[1]-4),doc.splitTextToSize(txt(r.desc),mw[2]-4)];
      const h=Math.max(...cells.map(c=>c.length))*4.6+3;
      if(y+h>BOTTOM){doc.addPage();y=M;footer();hdr()}
      let xx=M;cells.forEach((c,i)=>{doc.rect(xx,y,mw[i],h);let ly=y+4.8;c.forEach(l=>{doc.text(l,xx+2,ly);ly+=4.6});xx+=mw[i]});y+=h;
    });
    y+=5;
  }
  if((it.note||"").trim()||haVoce("note"))box("Note",it.note,haVoce("note"));

  // firme a piè di pagina (ultima pagina)
  const SIG_TOP=247;
  if(y>SIG_TOP-4){doc.addPage();y=M;footer()}
  doc.setDrawColor(150);doc.setLineWidth(.2);doc.line(M,SIG_TOP-3,W-M,SIG_TOP-3);
  [[M,"Firma cliente"+(it.nomeFirmatario?" ("+it.nomeFirmatario+")":""),it.firmaCliente],[M+half+6,"Firma tecnico"+(it.tecnico?" ("+it.tecnico+")":""),it.firmaTecnico]].forEach(([xx,t,img])=>{
    lbl(t,xx,SIG_TOP+1);
    if(img){try{const p=doc.getImageProperties(img);const maxW=half,maxH=24;const r=Math.min(maxW/p.width,maxH/p.height);doc.addImage(img,"PNG",xx,SIG_TOP+3+(maxH-p.height*r),p.width*r,p.height*r)}catch(e){}}
    doc.setDrawColor(0);doc.setLineWidth(.3);doc.line(xx,SIG_TOP+28,xx+half,SIG_TOP+28);
  });
  if(it.modificaConclusa&&it.modificaConclusa.nome){
    doc.setFont("helvetica","bold");doc.setFontSize(10);
    doc.text(txt("RAPPORTO DI LAVORO CONCLUSO E MODIFICATO DA : "+it.modificaConclusa.nome),M,SIG_TOP+35);
    doc.setFont("helvetica","normal");
  }
  doc.setFontSize(8);doc.setTextColor(110);doc.text(txt(`Documento generato il ${new Date().toLocaleString("it-IT")}`),M,292);doc.setTextColor(0);

  // documentazione fotografica sugli ultimi fogli: max 4 per pagina (2x2), ogni foto in un riquadro,
  // area immagine non oltre 1/6 del foglio A4 (210x297 mm)
  const foto=(it.foto||[]).filter(f=>fotoData[f.id]);
  if(foto.length){
    const MAX_AREA=210*297/6, GAP=6, colW=(CW-GAP)/2, top0=M+10, cellH=(BOTTOM-top0-GAP)/2;
    const PAD=4, DESC_LINES=5, LH=4, imgBoxW=colW-2*PAD, imgBoxH=cellH-2*PAD-DESC_LINES*LH-3;
    const title=()=>{doc.setFont("helvetica","bold");doc.setFontSize(11);doc.text("DOCUMENTAZIONE FOTOGRAFICA",M,M+4);
      doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(95);doc.text(txt(`Rapportino n. ${it.numero} - ${it.cliente.nome||""}`),W-M,M+4,{align:"right"});doc.setTextColor(0)};
    foto.forEach((f,i)=>{
      const k=i%4;
      if(k===0){doc.addPage();footer();title()}
      const cx=M+(k%2)*(colW+GAP), cy=top0+Math.floor(k/2)*(cellH+GAP);
      doc.setDrawColor(120);doc.setLineWidth(.3);doc.rect(cx,cy,colW,cellH);
      let p=null;try{p=doc.getImageProperties(fotoData[f.id])}catch(e){}
      if(p){
        let r=Math.min(imgBoxW/p.width,imgBoxH/p.height);
        let w=p.width*r,h=p.height*r;
        if(w*h>MAX_AREA){const s=Math.sqrt(MAX_AREA/(w*h));w*=s;h*=s}
        try{doc.addImage(fotoData[f.id],"JPEG",cx+(colW-w)/2,cy+PAD+(imgBoxH-h)/2,w,h)}catch(e){}
      }
      const dy=cy+PAD+imgBoxH+3;
      doc.setDrawColor(200);doc.setLineWidth(.2);doc.line(cx+PAD,dy-1.5,cx+colW-PAD,dy-1.5);
      doc.setFontSize(9);doc.setFont("helvetica","bold");doc.text(txt(`Foto ${i+1}`),cx+PAD,dy+2.5);
      doc.setFont("helvetica","normal");
      let lines=f.descrizione?doc.splitTextToSize(txt(f.descrizione),imgBoxW):[];
      if(lines.length>DESC_LINES-1){lines=lines.slice(0,DESC_LINES-1);lines[lines.length-1]=lines[lines.length-1].replace(/\s*\S*$/,"")+"..."}
      lines.forEach((l,j)=>doc.text(l,cx+PAD,dy+2.5+(j+1)*LH));
    });
  }

  const name=`rapportino_${it.numero.replace("/","-")}_${(it.cliente.nome||"cliente").replace(/[^\w]+/g,"_").slice(0,40)}.pdf`;
  return{name,blob:doc.output("blob")};
}

function normServer(v){
  v=String(v||"").trim().replace(/\/+$/,"");if(!v)return"";
  // senza http:// o https:// Chrome usa http: l'app fa lo stesso (https solo per gli indirizzi Tailscale)
  if(!/^https?:\/\//i.test(v))v=(/\.ts\.net(:\d+)?$/i.test(v)?"https://":"http://")+v;
  // indirizzo di rete locale scritto con https: il server dell'ufficio risponde in http
  if(/^https:\/\/(\d{1,3}\.){3}\d{1,3}:8080$/i.test(v))v=v.replace(/^https:/i,"http:");
  return v;
}

  view="login";$("#bNew").classList.add("hidden");$("#bSettings").classList.add("hidden");$("#bEsci").classList.add("hidden");
  app.innerHTML=`<form class="sheet login" id="lfrm" novalidate>
    <div class="sheet-head"><div><h2>Accedi</h2><span class="n">Usa l'account ricevuto dall'amministratore</span></div></div>
    <div class="login-body">
      <img src="icons/logo.jpg" alt="Codenotti Automation" class="login-logo">
      ${NATIVO?`<label class="f">Indirizzo del server<input name="server" type="url" inputmode="url" autocapitalize="off" autocomplete="off" placeholder="https://pc-ufficio.tuarete.ts.net" value="${esc(LocalDB.server())}"></label>`:""}
      <label class="f">Email<input name="email" type="email" autocomplete="username" required></label>
      <label class="f">Password<input name="pw" type="password" autocomplete="current-password" required></label>
      ${msg?`<p class="login-err" role="alert">${esc(msg)}</p>`:""}
      <button class="btn primary" type="submit">Accedi</button>
      <p class="note" style="text-align:center;margin:0">Password dimenticata? Chiedi all'amministratore di impostarne una nuova.</p>
    </div></form>`;
  const f=$("#lfrm");(f.elements.server&&(chiediServer||!f.elements.server.value)?f.elements.server:f.elements.email).focus();
  f.onsubmit=async e=>{e.preventDefault();const b=f.querySelector('[type=submit]');
    if(f.elements.server){
      const sv=normServer(f.elements.server.value);
      if(!sv){f.elements.server.focus();toast("Scrivi l'indirizzo del server");return}
      await LocalDB.impostaServer(sv);
    }
    b.disabled=true;b.textContent="Accesso…";
    try{const u=await LocalDB.login(f.elements.email.value.trim(),f.elements.pw.value);avvia(u)}
    catch(err){mostraLogin(err.code==="credenziali"?"Email o password non corretti.":err.code==="unavailable"?(NATIVO?`Server non raggiungibile all'indirizzo ${LocalDB.server()}. Deve essere identico a quello che funziona in Chrome, compreso http:// e :8080.${err.dettaglio?" (Dettaglio: "+err.dettaglio+")":""}`:"Server non raggiungibile: per il primo accesso devi essere collegato alla rete dell'ufficio."):"Accesso non riuscito ("+(err.message||err.code)+")")}};
}
let avviato=false;
async function avvia(user){
  $("#bNew").classList.remove("hidden");$("#bSettings").classList.remove("hidden");$("#bEsci").classList.remove("hidden");
  app.innerHTML=`<div class="loading">Caricamento…</div>`;
  await store.init(user);
  if(!user.nome){
    const v=await dialogo("Benvenuto! Come ti chiami?\n\nIl tuo nome comparirà sui rapportini che crei o modifichi.",{ok:"Continua",input:{placeholder:"Nome e cognome",label:"Il tuo nome"}});
    if(v)await impostaNome(v).catch(()=>{});
  }
  try{items=await store.list();cfg=await store.getCfg()}catch(e){items=[];toast("Impossibile leggere i dati salvati")}
  if(cfg.nome)$("#sub").textContent=cfg.nome;
  try{nascosti=await store.getNascosti()}catch(e){}
  renderList();aggiornaRete();
  if(!avviato){avviato=true;
    store.subscribe(nuovi=>{
      items=nuovi;
      if(view==="list"){
        const focus=document.activeElement&&document.activeElement.id==="q",pos=focus?document.activeElement.selectionStart:0;
        renderList();
        if(focus){const n=$("#q");n.focus();n.setSelectionRange(pos,pos)}
      }
    });
  }
}
$("#bEsci").onclick=async()=>{
  const coda=statoRete.inCoda;
  if(!await chiedi(coda?`Ci sono ${coda} modifiche non ancora inviate al server: uscendo andrebbero perse.\n\nCollegati alla rete dell'ufficio prima di uscire.`:"Vuoi uscire dall'applicazione su questo dispositivo?",{ok:coda?"Esci comunque":"Esci",danger:!!coda}))return;
  await LocalDB.logout();location.reload()};
window.addEventListener("rapportini-logout",()=>{if(view!=="login")mostraLogin("Sessione scaduta: accedi di nuovo.")});
(async()=>{
  if(!NATIVO&&"serviceWorker" in navigator&&window.isSecureContext)navigator.serviceWorker.register("sw.js").catch(()=>{});
  if(NATIVO){
    // tasto Indietro di Android: chiude le finestre, poi torna all'elenco, poi esce
    try{plug("App").addListener("backButton",()=>{
      const m=document.querySelector(".modal");
      if(m){const c=m.querySelector('[data-r="0"]')||m.querySelector('[data-r="1"]');if(c)c.click();return}
      const pop=document.querySelector(".combo-pop:not(.hidden)");if(pop){pop.classList.add("hidden");return}
      if(view==="form"||view==="settings"){const b=$("#bBack")||$("#sBack");if(b)b.click();else renderList();return}
      plug("App").exitApp();
    })}catch(e){}
    if(!LocalDB.server())return mostraLogin("",true);
  }
  const u=LocalDB.utente();
  if(!u)return mostraLogin();
  try{const v=await LocalDB.aggiornaUtente();avvia(v||u)}
  catch(e){if(e&&e.code==="unauthenticated")mostraLogin("Sessione scaduta: accedi di nuovo.");else avvia(u)}
})();
})();
</script>
</body>
</html>
